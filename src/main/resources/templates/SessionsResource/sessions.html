<html lang="en">
<head>
    <title>JNation 2025 Sessions</title>
    <meta http-equiv="refresh" content="30" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            color: white;
            font-family: sans-serif;
        }
        h1 {
            font-size: 28pt;
            margin: 0;
        }
        h3 {
            font-size: 20pt;
            margin: 0;
        }
        span {
            margin-right: 5px;
        }
        .session {
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            text-align: left;
            display: flex;
            align-items: stretch;
        }
        .title {
            width: 43%;
            padding-left: 2%;
            padding-right: 2%;
            display: flex;
            align-items: center;
        }
        .room {
            width: 20%;
            display: flex;
            align-items: center;
        }
        .speakers {
            width: 28%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            overflow: hidden;
            padding: 12px 0;
            box-sizing: border-box;
        }
        .speaker-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 0;
        }
        img {
            width: clamp(40px, 4vw, 70px);
            height: clamp(40px, 4vw, 70px);
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        /* Compact layout for 4+ speakers */
        .speakers:has(.speaker-item:nth-child(4)) {
            gap: 2px;
            padding: 6px 0;
            justify-content: space-evenly;
        }
        .speakers:has(.speaker-item:nth-child(4)) img {
            width: 28px;
            height: 28px;
        }
        .speakers:has(.speaker-item:nth-child(4)) h3 {
            font-size: 13pt;
        }
    </style>
</head>
<body>
    {#for session in sessions}
    <div class="session" style="background-color: {session.roomCssColor.css}">
        <div class="title">
            <h1>{session.title}</h1>
        </div>
        <div class="room">
            <div style="width: 100%;">
                <h3><span class="material-symbols-outlined">meeting_room</span> {session.room}</h3>
                <h3><span class="material-symbols-outlined">schedule</span> {session.startsAt.format('HH:mm')} - {session.endsAt.format('HH:mm')}</h3>
            </div>
        </div>
        <div class="speakers">
            {#for speaker in session.speakers}
                <div class="speaker-item">
                    <img src="{speaker.profilePicture}" alt="">
                    <h3>{speaker.fullName}</h3>
                </div>
            {/for}
        </div>
    </div>
    {/for}
</body>
</html>
